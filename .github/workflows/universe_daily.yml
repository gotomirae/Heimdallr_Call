# PRD Ref: §10 · ADR50
name: universe_daily
run-name: universe_daily · ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || format('schedule(예비) {0}', github.event.schedule)
  }}
concurrency:
  group: universe-daily
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: '1'
      KOREA_EXTRA_HOLIDAYS: ${{ vars.KOREA_EXTRA_HOLIDAYS }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -e .
    - name: 오늘 몫이 끝났는가 · 장 시작 전에 끝날 수 있는가
      id: gate
      run: python -m src.db.job_runs gate --job universe_daily --timeout-minutes 185 --gate-output "$GITHUB_OUTPUT"
  refresh:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      PYTHONUNBUFFERED: '1'
      KOREA_EXTRA_HOLIDAYS: ${{ vars.KOREA_EXTRA_HOLIDAYS }}
      HEIMDALLR_DAILY_INDICATORS_ALLOWED: 'true'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: KIS 토큰 캐시 복원
      uses: actions/cache@v6
      with:
        path: .cache
        key: kis-token-${{ github.run_id }}
        restore-keys: kis-token-
    - name: 설치
      run: pip install -e .
    - name: 유니버스 갱신
      run: python -m src.universe.build --save
    - name: 시세 · 지수 스냅샷
      run: python -m src.collectors.price_run --save
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json
    - name: 지표 수집기 의존성 설치
      working-directory: dashboard
      run: npm ci
    - name: 상세 화면 일봉·수급·가치지표 16시 스냅샷
      working-directory: dashboard
      run: node scripts/refresh-indicator-details.cjs
    - name: 네이버 컨센서스 · 확정 및 선행 PER
      run: python -m src.collectors.consensus_run --save
    - name: 스크리닝 재계산
      run: python -m src.screener.run --save
    - name: 정밀 재무 반영 스크리닝
      run: python -m src.screener.run --save
    - name: 분기말·주간 주가
      continue-on-error: true
      run: python -m src.collectors.quarter_prices --save
    - name: 매크로 변동 지표만 갱신
      run: python -m src.collectors.us_macro_daily --write
    - name: 검증된 매크로 지표 저장
      run: "if ! git diff --quiet -- dashboard/lib/macro-daily.json; then\n  git config user.name \"github-actions[bot]\"\n\
        \  git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n  git add dashboard/lib/macro-daily.json\n\
        \  git commit -m \"chore: refresh daily dynamic indicators\"\n  git pull --rebase origin main\n  git push origin HEAD:main\n\
        fi"
    - name: 오늘 완료 표식
      run: python -m src.db.job_runs done --job universe_daily --run-id ${{ github.run_id }}
'on':
  schedule:
  - cron: 0 7 * * 1-5
  workflow_dispatch:
    inputs:
      trigger:
        description: 호출 주체 — pg_cron은 'pg_cron 06:00'처럼 넘긴다(실행 이름에만 쓴다)
        type: string
        default: manual
permissions:
  contents: write
