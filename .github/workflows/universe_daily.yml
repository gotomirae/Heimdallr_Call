# PRD Ref: §10 · traps.md T23, T32
#
# 유니버스 + 시세 + PRI 재계산. 하루 1회.
#
# ★ 06:00 KST 고정이다(T23). 장중에 돌리면 시총 경계(1,000~1,100억에 57종목)
#   종목이 실행마다 들락거려 **결과가 재현되지 않는다.**
# ★ KIS를 쓰는 유일한 워크플로다. 하루 1회라 토큰 재발급이 한도에 안 걸리지만,
#   수동 재실행이 잦으면 발급 제한(분당 1회)에 걸려 `.cache/`를 보존한다.

name: universe_daily

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:

concurrency:
  group: universe-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 시세 1,112종목 × 2콜 ≈ 33분 (실측 1,988초)
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ★ KIS 토큰 캐시. 러너는 매번 새로 뜨므로 이게 없으면 실행마다 재발급한다.
      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v6
        with:
          path: .cache
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - name: 설치
        run: pip install -e .

      - name: 유니버스 갱신
        run: python -m src.universe.build --save

      - name: 시세 · 지수 스냅샷
        run: python -m src.collectors.price_run --save

      # 시세가 바뀌면 PRI가 바뀌고 등급도 바뀐다 — 같은 잡에서 이어서 돌린다.
      - name: 스크리닝 재계산
        run: python -m src.screener.run --save

      # 상세화면 9분기 차트의 주가 라인.
      # ★ 스크리닝 **뒤에** 돌린다 — 게이트 통과 종목만 채우므로 등급이 갱신된
      #   다음이어야 이번에 새로 올라온 종목이 포함된다.
      # ★ 실패해도 잡을 세우지 않는다. 주가 라인이 빠질 뿐 실적 라인은 그대로다.
      - name: 분기말 주가 (차트용)
        continue-on-error: true
        run: python -m src.collectors.quarter_prices --save
