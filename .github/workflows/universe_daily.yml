# PRD Ref: §10 · traps.md T23, T32
#
# 유니버스 + 시세 + PRI 재계산. 하루 1회.
#
# ★ 06:00 KST 고정이다(T23). 장중에 돌리면 시총 경계(1,000~1,100억에 57종목)
#   종목이 실행마다 들락거려 **결과가 재현되지 않는다.**
# ★ KIS를 쓰는 유일한 워크플로다. 하루 1회라 토큰 재발급이 한도에 안 걸리지만,
#   수동 재실행이 잦으면 발급 제한(분당 1회)에 걸려 `.cache/`를 보존한다.
#
# ★★ 정시 시작 = Supabase pg_cron → workflow_dispatch(docs/migrations/cron_universe_daily.sql · T229).
#   06:00 KST 정시 + 16:30 KST 보충. GitHub schedule은 06:00 예약이 08:41~09:51에 시작해(9/28~10/2)
#   장중가가 종가로 저장됐다(T217). 아래 schedule은 pg_cron 장애 대비 30분 뒤 예비다.
# ★ gate 잡: ① 오늘(KST) `job_runs` 완료면 skip ② 평일에 지금 시작하면 제한시간 안에 장중(09:00~16:00)에
#   걸리면 skip — 시세 라벨이 시작 시각에 고정돼 장중가가 종가로 저장된다. 16:30 보충이 그날 몫을 메운다.
#   `--timeout-minutes`는 refresh 제한시간 + 5분(gate 잡 시간 여유)이다.

name: universe_daily
run-name: universe_daily · ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || format('schedule(예비) {0}', github.event.schedule) }}

on:
  schedule:
    - cron: "30 21 * * *" # 06:30 KST 예비 (pg_cron 06:00 + 30분)
    - cron: "0 8 * * *" # 17:00 KST 예비 (pg_cron 16:30 + 30분)
  workflow_dispatch:
    inputs:
      trigger:
        description: "호출 주체 — pg_cron은 'pg_cron 06:00'처럼 넘긴다(실행 이름에만 쓴다)"
        type: string
        default: manual
      force:
        description: "게이트 무시(오늘 완료·장중 시작이어도 실행) — 장중이면 장중가가 저장된다"
        type: boolean
        default: false

concurrency:
  group: universe-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # ★ 분기는 셸에서 한다 — schedule 경로에는 inputs가 없다(T79). 판정 실패는 skip=false.
      - name: 오늘 몫이 끝났는가 · 장 시작 전에 끝날 수 있는가
        id: gate
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            python -m src.db.job_runs gate --job universe_daily --timeout-minutes 95 --gate-output "$GITHUB_OUTPUT" \
              || echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 시세 1,112종목 + 발표 후 외국인 5거래일 수급 페이지
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANALYSIS_LLM_PROVIDER: ${{ vars.ANALYSIS_LLM_PROVIDER }}
      OPENAI_ANALYSIS_MODEL: ${{ vars.OPENAI_ANALYSIS_MODEL }}
      OPENAI_INPUT_PER_MTOK: ${{ vars.OPENAI_INPUT_PER_MTOK }}
      OPENAI_OUTPUT_PER_MTOK: ${{ vars.OPENAI_OUTPUT_PER_MTOK }}
      OPENAI_CACHE_WRITE_PER_MTOK: ${{ vars.OPENAI_CACHE_WRITE_PER_MTOK }}
      OPENAI_CACHE_READ_PER_MTOK: ${{ vars.OPENAI_CACHE_READ_PER_MTOK }}
      MONTHLY_COST_CEILING_USD: ${{ vars.MONTHLY_COST_CEILING_USD }}
      DAILY_ANALYSIS_LIMIT: ${{ vars.DAILY_ANALYSIS_LIMIT }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ★ KIS 토큰 캐시. 러너는 매번 새로 뜨므로 이게 없으면 실행마다 재발급한다.
      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v6
        with:
          path: .cache
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - name: 설치
        run: pip install -e .

      - name: 유니버스 갱신
        run: python -m src.universe.build --save

      # 투자 섹터는 투자 매력도의 산업 성장·산업 내 위치·피어 밸류 분모다.
      # 반드시 스크리닝보다 먼저 저장해야 당일 점수가 새 분류를 사용한다.
      - name: 투자 섹터 분류
        run: python -m src.universe.sector_map --save

      # JARVIS 노션 L1 매핑(B-10). API를 못 읽으면 PRD 부록 A.5 정적표로 저장한다.
      # 컬럼 마이그레이션 전에는 실패로 표시만 하고 시세·스크리닝은 계속 돈다.
      - name: JARVIS L1 매핑
        continue-on-error: true
        env:
          JARVIS_BASE_URL: ${{ vars.JARVIS_BASE_URL }}
          JARVIS_PUBLIC_TOKEN: ${{ secrets.JARVIS_PUBLIC_TOKEN }}
        run: python -m src.universe.industry_l1 --save

      - name: 시세 · 지수 스냅샷
        run: python -m src.collectors.price_run --save

      - name: 네이버 컨센서스 · 확정 및 선행 PER
        run: python -m src.collectors.consensus_run --save

      # 시세가 바뀌면 PRI가 바뀌고 등급도 바뀐다 — 같은 잡에서 이어서 돌린다.
      - name: 스크리닝 재계산
        run: python -m src.screener.run --save

      - name: 신규 확정 종목 정밀 재무
        run: python -m src.finance.detail --save

      - name: 정밀 재무 반영 스크리닝
        run: python -m src.screener.run --save

      # 주간 종가 차트와 LLM 가치-가격 시차 분석용 분기말 가격.
      # ★ 스크리닝 **뒤에** 돌린다 — 게이트 통과 종목만 채우므로 등급이 갱신된
      #   다음이어야 이번에 새로 올라온 종목이 포함된다.
      # ★ 실패해도 잡을 세우지 않는다. 가격 이력만 빠지고 실적은 그대로다.
      - name: 분기말·주간 주가
        continue-on-error: true
        run: python -m src.collectors.quarter_prices --save

      # 정기보고서 뒤 실제 KOSPI 거래일 5일을 모두 기다린다. ★·○는 같은 분기에서
      # 딱 한 번만 최근 10일 증권사 리포트를 검색해 3차 최종 분석한다. 일상적인 시세
      # 변화는 근거 hash에서 제외하고 동일 단계·동일 근거 실패는 다시 결제하지 않는다.
      - name: 5거래일 리포트 반영 최종 분석
        continue-on-error: true
        run: python -m src.analysis.batch --send --report-final --notify-only --max-seconds 300

      # 위 필수 스텝이 전부 성공했을 때만 남는다 — 예비·보충 실행이 게이트에서 끝나게 한다.
      - name: 오늘 완료 표식
        run: python -m src.db.job_runs done --job universe_daily --run-id ${{ github.run_id }}
