# PRD Ref: §8.1 · traps.md T44
# Telegram getUpdates는 로컬 HeimdallrTelegramListener가 단독으로 소비한다.
# 이 워크플로는 과거 작업 ID와 운영 기록을 보존하되 실행하지 않는다.
name: telegram_listen

on:
  workflow_dispatch:

concurrency:
  group: telegram-listen
  cancel-in-progress: false

jobs:
  listen:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Telegram listener runs on the local scheduled task."
