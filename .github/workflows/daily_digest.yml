# PRD Ref: §8.4, §8.8, §10
#
# 📊 일일 요약. 장 마감 후 1회.
# ★ 요약 **앞에** JARVIS `entry_checks`(M1·M2·M5)를 계산한다(INTEGRATION_TASKS B-7).
#
# ★★ 정시 시작 = Supabase pg_cron → workflow_dispatch(docs/migrations/cron_dispatch.sql · T228).
#   17:37·18:17·19:07 KST. GitHub schedule은 실측 7시간 지연(10/1 17:37분이 00:37 시작)이라
#   JARVIS 19:10 판정에 늦었다(D50 '원천 지연'). 아래 schedule은 pg_cron 장애 대비 **30분 뒤 예비**다.
# ★ 하루에 여러 번 돌아도 결과는 한 번이다:
#   ① 게이트 — 오늘 요약이 나갔고 entry_checks가 완료로 기록됐으면 나머지 스텝을 건너뛴다
#   ② entry_checks — (code, check_date) upsert · 원천 실패 행은 앞 실행의 완전한 행을 덮지 않는다
#   ③ 📊 요약 — `payload.digest_date`(16:00 KST 경계 KR 날짜)로 1일 1회
#   ④ 🔵 K1·추천 — (code, 분기, kind) 중복키 + KST 하루 상한

name: daily_digest
run-name: daily_digest · ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || format('schedule(예비) {0}', github.event.schedule) }}

on:
  schedule:
    - cron: "7 9 * * 1-5" # 18:07 KST 예비 (pg_cron 17:37 + 30분)
    - cron: "47 9 * * 1-5" # 18:47 KST 예비 (pg_cron 18:17 + 30분)
    - cron: "37 10 * * 1-5" # 19:37 KST 예비 (pg_cron 19:07 + 30분)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "entry_checks·기술 신호만 점검 (텔레그램·DB 쓰기 없음)"
        type: boolean
        default: false
      trigger:
        description: "호출 주체 — pg_cron은 'pg_cron 17:37'처럼 넘긴다(실행 이름에만 쓴다)"
        type: string
        default: manual

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # entry_checks: 1단계 통과 종목만 KIS 수급 + 네이버 일봉
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      # M5 투자자별 매매(KIS 시세 조회 경로 · 주문 API 아님). 없으면 네이버로 폴백한다.
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      # 미설정이면 빈 문자열이 되고 optional_env가 코드 기본값으로 떨어진다(안전).
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      TECHNICAL_SCAN_SUMMARY_PATH: technical-scan.json
      ENTRY_CHECKS_SUMMARY_PATH: entry-checks.json
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # ★ KIS 토큰 캐시(T15). universe_daily와 같은 키 접두라 그날 발급분을 재사용한다.
      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v6
        with:
          path: .cache
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-
      - run: pip install -e .
      # 정시(pg_cron)와 예비(schedule)가 둘 다 돈 날, 뒤의 것은 여기서 끝난다.
      # 판정 실패는 skip=false(그냥 돈다) — 중복 발송은 뒤 스텝의 키가 막는다.
      # ★ 분기는 셸에서 한다 — schedule 경로에는 inputs가 없다(T79).
      - name: 오늘 몫이 이미 끝났는가
        id: gate
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # 게이트가 죽어도 스텝은 성공해야 한다 — 실패하면 뒤 스텝의 암묵적 success()가 entry_checks를 건너뛴다
            python -m src.notify.batch --digest-gate --gate-output "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # JARVIS 진입 필수 조건. DB만으로 M1 재무를 거른 뒤 통과 종목만 수급·일봉을 본다.
      - name: JARVIS entry_checks (M1·M2·M5) · 🔵 K1
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.notify.entry_checks_run --summary-path entry-checks.json
          else
            python -m src.notify.entry_checks_run --save --send --summary-path entry-checks.json
          fi
      # 펀더멘털 지속 조건을 먼저 통과한 종목만 네이버 일봉으로 기술 신호를 본다.
      # 알림 실패는 워크플로 실패로 드러낸다. 기존 일일 요약은 계속 보낸다.
      - name: 오늘의 종목 추천 · 최대 2개
        if: (success() || failure()) && steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.notify.technical_alert --summary-path technical-scan.json
          else
            python -m src.notify.technical_alert --send --summary-path technical-scan.json
          fi
      - name: 📊 일일 요약 (digest_date당 1회)
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m src.notify.batch --digest --send
          fi
