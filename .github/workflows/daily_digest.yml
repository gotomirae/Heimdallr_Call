# PRD Ref: §10 · ADR50
name: daily_digest
run-name: daily_digest · ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || format('schedule(예비) {0}', github.event.schedule)
  }}
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      TECHNICAL_SCAN_SUMMARY_PATH: technical-scan.json
      ENTRY_CHECKS_SUMMARY_PATH: entry-checks.json
      PYTHONUNBUFFERED: '1'
      KOREA_EXTRA_HOLIDAYS: ${{ vars.KOREA_EXTRA_HOLIDAYS }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: KIS 토큰 캐시 복원
      uses: actions/cache@v6
      with:
        path: .cache
        key: kis-token-${{ github.run_id }}
        restore-keys: kis-token-
    - run: pip install -e .
    - id: calendar
      name: 한국 거래일16시 판정
      run: python -m src.utils.operating_calendar indicators --output "$GITHUB_OUTPUT"
    - name: 오늘 몫이 이미 끝났는가
      id: gate
      run: "if [ \"${{ inputs.dry_run }}\" = \"true\" ]; then\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nelse\n  # 게이트가\
        \ 죽어도 스텝은 성공해야 한다 — 실패하면 뒤 스텝의 암묵적 success()가 entry_checks를 건너뛴다\n  python -m src.notify.batch --digest-gate --gate-output\
        \ \"$GITHUB_OUTPUT\" || echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      if: steps.calendar.outputs.run == 'true'
    - name: JARVIS entry_checks (M1·M2·M5) · 🔵 K1
      if: steps.calendar.outputs.run == 'true' && (steps.gate.outputs.skip != 'true')
      run: "if [ \"${{ inputs.dry_run }}\" = \"true\" ]; then\n  python -m src.notify.entry_checks_run --summary-path entry-checks.json\n\
        else\n  python -m src.notify.entry_checks_run --save --send --summary-path entry-checks.json\nfi\n"
    - name: 오늘의 종목 추천 · 최대 2개
      if: steps.calendar.outputs.run == 'true' && ((success() || failure()) && steps.gate.outputs.skip != 'true')
      run: "if [ \"${{ inputs.dry_run }}\" = \"true\" ]; then\n  python -m src.notify.technical_alert --summary-path technical-scan.json\n\
        else\n  python -m src.notify.technical_alert --send --summary-path technical-scan.json\nfi\n"
    - name: 📊 일일 요약 (digest_date당 1회)
      if: steps.calendar.outputs.run == 'true' && (always() && steps.gate.outputs.skip != 'true')
      run: "if [ \"${{ inputs.dry_run }}\" != \"true\" ]; then\n  python -m src.notify.batch --digest --send\nfi\n"
'on':
  schedule:
  - cron: 0 7 * * 1-5
  workflow_dispatch:
    inputs:
      dry_run:
        description: entry_checks·기술 신호만 점검 (텔레그램·DB 쓰기 없음)
        type: boolean
        default: false
      trigger:
        description: 호출 주체 — pg_cron은 'pg_cron 17:37'처럼 넘긴다(실행 이름에만 쓴다)
        type: string
        default: manual
