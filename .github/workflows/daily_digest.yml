# PRD Ref: §8.4, §10
#
# 📊 일일 요약. 장 마감 후 1회.
# ★ 중복은 `notifications`가 막는다(kind=daily, 날짜 기준).

name: daily_digest

on:
  schedule:
    # GitHub 예약 실행은 수 시간 지연될 수 있다(T164). 서로 다른 분에 세 번
    # 기회를 두고, notifications의 KST 일일 상한·종목/분기 중복키로 재발송을 막는다.
    - cron: "37 8 * * 1-5" # 17:37 KST — 장 마감 후 1차
    - cron: "17 9 * * 1-5" # 18:17 KST — 지연/누락 재시도
    - cron: "7 10 * * 1-5" # 19:07 KST — 최종 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: "기술 신호만 점검 (텔레그램·DB 쓰기 없음)"
        type: boolean
        default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      # 미설정이면 빈 문자열이 되고 optional_env가 코드 기본값으로 떨어진다(안전).
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      TECHNICAL_SCAN_SUMMARY_PATH: technical-scan.json
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # 펀더멘털 지속 조건을 먼저 통과한 종목만 네이버 일봉으로 기술 신호를 본다.
      # 알림 실패는 워크플로 실패로 드러낸다. 기존 일일 요약은 계속 보낸다.
      - name: 오늘의 종목 추천 · 최대 2개
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.notify.technical_alert --summary-path technical-scan.json
          else
            python -m src.notify.technical_alert --send --summary-path technical-scan.json
          fi
      - if: always()
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m src.notify.batch --digest --send
          fi
