# PRD Ref: §9.1 · traps.md T2/T7/T235 — 과거 GPM 전수 보충. 유료 LLM 호출 없음.
name: gpm_history

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "기업코드 쉼표 구분, 비워 두면 전체"
        type: string
        default: ""

concurrency:
  group: gpm-history-full
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
      CODES_INPUT: ${{ inputs.codes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: 기업 고정 분할 · 최근 10분기 GPM 원문 보충
        run: |
          if [ -n "$CODES_INPUT" ]; then
            python -m src.finance.detail --gpm-history --full-history --save --code "$CODES_INPUT" --shard-index ${{ matrix.shard }} --shard-count 4
          else
            python -m src.finance.detail --gpm-history --full-history --save --shard-index ${{ matrix.shard }} --shard-count 4
          fi
