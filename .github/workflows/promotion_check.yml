# PRD Ref: §10 · ADR50
name: promotion_check
concurrency:
  group: promotion-check
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      PYTHONUNBUFFERED: '1'
      KOREA_EXTRA_HOLIDAYS: ${{ vars.KOREA_EXTRA_HOLIDAYS }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -e .
    - id: calendar
      name: 한국 거래일16시 판정
      run: python -m src.utils.operating_calendar indicators --output "$GITHUB_OUTPUT"
    - run: python -m src.notify.promotion --send
      if: steps.calendar.outputs.run == 'true'
'on':
  schedule:
  - cron: 0 7 * * 1-5
  workflow_dispatch: null
