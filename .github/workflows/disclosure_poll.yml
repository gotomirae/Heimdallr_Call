# PRD Ref: §10, §10.2 · traps.md T28, T36
#
# DART 공시 폴링 → 잠정실적 파싱 → 파생지표 → 스크리닝 → ⚡알림.
#
# ★ 시즌/비시즌 빈도를 `SEASON_MODE` 저장소 변수로 전환한다.
#   GitHub Actions의 cron은 조건부로 못 쓰므로 **두 스케줄을 다 걸고 잡 안에서 건너뛴다.**
#   (건너뛰는 잡도 시작 비용이 들지만 몇 초라 폴링 자체보다 훨씬 싸다.)
# ★ 잡 안에서 sleep 루프를 쓰지 않는다(PRD §10.1) — sleep도 과금된다.

name: disclosure_poll

on:
  schedule:
    - cron: "*/30 0-10 * * 1-5" # 시즌: 09:00~19:00 KST 30분마다
    - cron: "0 1,4,7,10 * * 1-5" # 비시즌: 하루 4회
  workflow_dispatch:
    inputs:
      notify:
        description: "★/○ 즉시 알림까지 발송"
        type: boolean
        default: true

concurrency:
  group: disclosure-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # ★ LLM 배치가 쓴다. 없으면 `require_env`가 명시적으로 실패한다 —
      #   조용히 분석을 건너뛰지 않는다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANALYSIS_LLM_PROVIDER: ${{ vars.ANALYSIS_LLM_PROVIDER }}
      OPENAI_ANALYSIS_MODEL: ${{ vars.OPENAI_ANALYSIS_MODEL }}
      OPENAI_INPUT_PER_MTOK: ${{ vars.OPENAI_INPUT_PER_MTOK }}
      OPENAI_OUTPUT_PER_MTOK: ${{ vars.OPENAI_OUTPUT_PER_MTOK }}
      OPENAI_CACHE_WRITE_PER_MTOK: ${{ vars.OPENAI_CACHE_WRITE_PER_MTOK }}
      OPENAI_CACHE_READ_PER_MTOK: ${{ vars.OPENAI_CACHE_READ_PER_MTOK }}
      # ★★ T82 — 넘기지 않으면 저장소 변수가 **에러 없이 무시**된다.
      #   비었으면 `optional_env_int`가 코드 기본값으로 떨어진다(안전).
      MONTHLY_COST_CEILING_USD: ${{ vars.MONTHLY_COST_CEILING_USD }}
      DAILY_ANALYSIS_LIMIT: ${{ vars.DAILY_ANALYSIS_LIMIT }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      # 미설정이면 빈 문자열이 되고 optional_env가 코드 기본값으로 떨어진다(안전).
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      # ★ 30분 스케줄은 시즌에만 의미가 있다. 비시즌이면 여기서 끝낸다.
      - name: 시즌 확인
        id: season
        run: |
          season="${{ vars.SEASON_MODE }}"
          frequent="${{ github.event.schedule == '*/30 0-10 * * 1-5' }}"
          if [ "$frequent" = "true" ] && [ "$season" != "on" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "비시즌이라 30분 폴링을 건너뛴다 (SEASON_MODE=$season)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.season.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.season.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        if: steps.season.outputs.run == 'true'
        run: pip install -e .

      # 최근 3일치만 훑는다. 텔레그램과 달리 DART는 과거를 계속 주므로
      # 놓친 공시가 있어도 다음 실행이 다시 잡는다.
      - name: 공시 감지 · 잠정실적 반영
        if: steps.season.outputs.run == 'true'
        run: |
          begin=$(date -u -d '3 days ago' +%Y%m%d)
          end=$(date -u +%Y%m%d)
          python -m src.collectors.replay --begin "$begin" --end "$end" --save
          python -m src.collectors.replay --begin "$begin" --end "$end" --ingest 200

      - name: 파생지표
        if: steps.season.outputs.run == 'true'
        run: python -m src.finance.enrich --save

      - name: 스크리닝
        if: steps.season.outputs.run == 'true'
        run: python -m src.screener.run --save

      # ★ LLM 배치 — 알림 **전에** 돌린다. 분석이 먼저 있어야 알림에 해석이 실린다.
      #   이미 분석된 종목은 재호출하지 않으므로 하루 여러 번 돌아도 비용이 안 늘어난다.
      #   상한은 코드가 건다(월 실링·일 상한 — 값은 `src/config/constants.py`).
      #   ★ 숫자를 여기 적지 않는다. 손으로 옮겨 적으면 조용히 어긋난다(T82).
      #   실패해도 잡을 세우지 않는다 —
      #   해석이 없으면 숫자만 담긴 알림이 나갈 뿐이다.
      # ★ 시간 예산을 잡의 timeout(15분)보다 작게 준다 — 강제 종료되면 진행 상황이
      #   로그에 안 남는다. 배치는 멱등이라 여러 실행에 걸쳐 누적된다.
      #   여기서는 **갓 발표된 종목**을 빠르게 해석하는 것이 목적이다(알림에 실린다).
      #   전체 따라잡기는 llm_batch.yml이 밤에 한다.
      - name: LLM 배치 분석 (신규 우선)
        if: steps.season.outputs.run == 'true'
        continue-on-error: true
        run: python -m src.analysis.batch --send --max-seconds 480

      # 중복은 `notifications` 테이블이 막는다 — 하루 38회 돌아도 같은 종목은 한 번만 나간다.
      #
      # ★★ T79 — 분기를 **셸로** 한다(T55와 같은 실패 모양이 여기서 재발했다).
      #   원래는 `if: … && inputs.notify != false`였다. `schedule`에는 inputs가 없어
      #   `inputs.notify`가 null인데, GitHub 표현식은 타입이 다르면 **숫자로 캐스팅**한다 —
      #   null도 0, false도 0이라 `null != false`가 **false**가 된다.
      #   즉 cron 경로에서 이 스텝은 **영영 skipped**였다. 대상 종목을 계산까지 다 해 놓고
      #   발송만 안 한다. `skipped`는 UI에서 **초록색**이라 잡 성공만 보면 못 알아챈다
      #   (`gh api …/jobs --jq '.jobs[].steps[]'`로 스텝 단위를 봐야 드러난다).
      - name: ⚡ 즉시 알림
        if: steps.season.outputs.run == 'true'
        env:
          # schedule에는 inputs가 없어 **빈 문자열**이 된다 → 아래에서 기본 ON이 된다.
          NOTIFY_INPUT: ${{ inputs.notify }}
        run: |
          # ★ 끄더라도 드라이런은 돌린다 — 무엇이 나갔을 것인지 로그에 남는다.
          #   조용히 건너뛰면 "발송 대상이 없었는지 스텝이 안 돌았는지"를 구분할 수 없다.
          if [ "$NOTIFY_INPUT" = "false" ]; then
            echo "즉시 알림 OFF — 수동 실행에서 명시적으로 껐다 (드라이런만 한다)"
            python -m src.notify.batch --flash
          else
            python -m src.notify.batch --flash --send
          fi
