# PRD Ref: §10 · ADR50
name: disclosure_poll
concurrency:
  group: disclosure-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      PYTHONUNBUFFERED: '1'
      KOREA_EXTRA_HOLIDAYS: ${{ vars.KOREA_EXTRA_HOLIDAYS }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: 설치
      run: pip install -e .
    - name: 실적시즌·비시즌16시 판정
      id: season
      run: python -m src.utils.operating_calendar disclosure --output "$GITHUB_OUTPUT"
    - name: 공시 감지 · 잠정실적 반영
      if: steps.season.outputs.run == 'true'
      run: 'begin=$(date -u -d ''7 days ago'' +%Y%m%d)

        end=$(date -u +%Y%m%d)

        python -m src.collectors.replay --begin "$begin" --end "$end" --save

        python -m src.collectors.replay --begin "$begin" --end "$end" --ingest 200

        '
    - name: 수시 계약 구조화 · 개별 실패 격리
      if: steps.season.outputs.run == 'true'
      continue-on-error: true
      run: python -m src.collectors.order_contract_run --limit 100 --save
    - name: 정기보고서 감지 · 확정 재무 갱신
      if: steps.season.outputs.run == 'true'
      run: python -m src.finance.backfill --save --recent-periodic-days 7
    - name: 파생지표
      if: steps.season.outputs.run == 'true'
      run: python -m src.finance.enrich --save
    - name: 스크리닝
      if: steps.season.outputs.run == 'true'
      run: python -m src.screener.run --save
    - name: 새 게이트 통과 종목 정밀 재무
      if: steps.season.outputs.run == 'true'
      run: python -m src.finance.detail --save --limit 4
    - name: 정밀 재무 반영 스크리닝
      if: steps.season.outputs.run == 'true'
      run: python -m src.screener.run --save
    - name: 과거 분기 GPM 점진 보충
      if: steps.season.outputs.run == 'true'
      timeout-minutes: 2
      continue-on-error: true
      run: python -m src.finance.detail --gpm-history --save --limit 4
    - name: 확정실적 원인 분석용 정기보고서 근거
      if: steps.season.outputs.run == 'true'
      run: python -m src.collectors.excerpt_run --save --limit 4 --max-seconds 120
    - name: ⚡ 즉시 알림
      if: steps.season.outputs.run == 'true'
      env:
        NOTIFY_INPUT: ${{ inputs.notify }}
      run: "# ★ 끄더라도 드라이런은 돌린다 — 무엇이 나갔을 것인지 로그에 남는다.\n#   조용히 건너뛰면 \"발송 대상이 없었는지 스텝이 안 돌았는지\"를 구분할 수 없다.\nif [\
        \ \"$NOTIFY_INPUT\" = \"false\" ]; then\n  echo \"즉시 알림 OFF — 수동 실행에서 명시적으로 껐다 (드라이런만 한다)\"\n  python -m\
        \ src.notify.batch --flash\nelse\n  python -m src.notify.batch --flash --send\nfi\n"
    - name: 공시 슬롯 완료표식
      if: steps.season.outputs.run == 'true'
      run: python -m src.utils.operating_calendar disclosure --complete
'on':
  schedule:
  - cron: 0 1-23/2 * * *
  workflow_dispatch:
    inputs:
      notify:
        description: ★/○ 즉시 알림까지 발송
        type: boolean
        default: true
