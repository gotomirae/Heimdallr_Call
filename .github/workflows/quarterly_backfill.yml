# PRD Ref: §7/10 · ADR50 — Pro 전용·거래일16시, 자동 모델 호출 없음
name: quarterly_backfill
concurrency:
  group: quarterly-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -e .
    - name: 확정 재무 수집
      env:
        CODES_INPUT: ${{ inputs.codes }}
      run: "if [ -n \"$CODES_INPUT\" ]; then\n  python -m src.finance.backfill --save --codes \"$CODES_INPUT\"\nelif [ \"\
        ${{ inputs.fix_missing_revenue }}\" = \"true\" ]; then\n  python -m src.finance.backfill --save --fix-missing-revenue\n\
        elif [ \"${{ inputs.full_history }}\" = \"true\" ]; then\n  python -m src.finance.backfill --save\nelse\n  python\
        \ -m src.finance.backfill --save --recent-periodic-days 45\nfi\n"
    - name: 파생지표
      run: python -m src.finance.enrich --save
    - name: 게이트 1차 계산
      run: python -m src.screener.run --save
    - name: 게이트 통과 종목 정밀 재무
      env:
        CODES_INPUT: ${{ inputs.codes }}
      run: "if [ -n \"$CODES_INPUT\" ]; then\n  python -m src.finance.detail --save --code \"$CODES_INPUT\" --refresh\nelse\n\
        \  python -m src.finance.detail --save\nfi\n"
    - name: D축 반영 최종 스크리닝
      run: python -m src.screener.run --save
    - name: 표시 구간 과거 GPM 보충
      env:
        CODES_INPUT: ${{ inputs.codes }}
      run: "if [ -n \"$CODES_INPUT\" ]; then\n  python -m src.finance.detail --gpm-history --save --code \"$CODES_INPUT\"\n\
        else\n  python -m src.finance.detail --gpm-history --save\nfi\n"
    - name: 정기보고서 서술 근거 갱신
      run: python -m src.collectors.excerpt_run --save --limit 200 --max-seconds 1800
    - name: 잠정 분석을 확정실적 분석으로 갱신
      run: python -m src.analysis.batch --send --refresh-finalized --max-seconds 2400
    if: ${{ false }}
'on':
  workflow_dispatch:
    inputs:
      fix_missing_revenue:
        description: 매출 결측 종목만 재수집 (T39 폴백)
        type: boolean
        default: false
      codes:
        description: 수동 갱신할 종목코드(쉼표 구분, 비우면 전체)
        type: string
        default: ''
      full_history:
        description: 전 종목 전체 연도 재수집(수동 복구용·시간 소요)
        type: boolean
        default: false
