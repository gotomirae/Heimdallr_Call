# PRD Ref: §10 · traps.md T2, T24, T39
#
# 확정 재무 배치. 잠정 → 확정 전환이 여기서 일어난다.
#
# ★ 전 종목 × 3개 연도 × 4보고서라 오래 걸린다. 스케줄은 월 2회.
# ★ `--fix-missing-revenue`는 주요계정 API가 매출을 안 주는 종목만 재수집한다(T39).

name: quarterly_backfill

on:
  schedule:
    - cron: "0 20 1,15 * *" # 매월 1·15일 05:00 KST
  workflow_dispatch:
    inputs:
      fix_missing_revenue:
        description: "매출 결측 종목만 재수집 (T39 폴백)"
        type: boolean
        default: false

concurrency:
  group: quarterly-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: 확정 재무 수집
        run: |
          if [ "${{ inputs.fix_missing_revenue }}" = "true" ]; then
            python -m src.finance.backfill --save --fix-missing-revenue
          else
            python -m src.finance.backfill --save
          fi

      - name: 파생지표
        run: python -m src.finance.enrich --save

      - name: 스크리닝 재계산
        run: python -m src.screener.run --save
