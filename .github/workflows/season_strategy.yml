# PRD Ref: §7/10 · ADR50 — Pro 전용·거래일16시, 자동 모델 호출 없음
name: season_strategy
permissions:
  contents: write
concurrency:
  group: season-strategy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -e .
    - run: python -m src.analysis.season_strategy_run --save
    - name: 전략 원본·검증 결과 저장 및 대시보드 갱신
      shell: bash
      run: "if git diff --quiet -- dashboard/lib/season-strategies.json; then exit 0; fi\ngit config user.name \"github-actions[bot]\"\
        \ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add dashboard/lib/season-strategies.json\n\
        git commit -m \"chore: update earnings season strategy review\"\nfor attempt in 1 2 3; do\n  git pull --rebase origin\
        \ main\n  if git push origin HEAD:main; then exit 0; fi\ndone\nexit 1\n"
    if: ${{ false }}
'on':
  workflow_dispatch: null
