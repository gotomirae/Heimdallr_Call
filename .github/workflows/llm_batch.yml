# PRD Ref: §7/10 · ADR50 — Pro 전용·거래일16시, 자동 모델 호출 없음
name: llm_batch
concurrency:
  group: llm-batch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      HEIMDALLR_TELEGRAM_BOT_TOKEN: ${{ secrets.HEIMDALLR_TELEGRAM_BOT_TOKEN }}
      HEIMDALLR_TELEGRAM_CHAT_ID: ${{ secrets.HEIMDALLR_TELEGRAM_CHAT_ID }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -e .
    - name: 공시 발췌 수집 (따라잡기)
      continue-on-error: true
      run: python -m src.collectors.excerpt_run --limit 300 --max-seconds 1500 --save
    - name: LLM 배치 (따라잡기)
      run: 'secs="${{ inputs.max_seconds }}"

        score="${{ inputs.min_score }}"

        [ -z "$secs" ] && secs=10800

        [ -z "$score" ] && score=0

        echo "시간 예산 ${secs}초 · 스코어 하한 ${score}"

        python -m src.analysis.batch --send --refresh-finalized --notify-only --max-seconds "$secs" --min-score "$score"

        '
    if: ${{ false }}
'on':
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 이번 실행 시간 예산(초)
        required: false
        default: '10800'
      min_score:
        description: 스코어 하한 (발송 등급 ★/○은 하한과 무관하게 항상 포함)
        required: false
        default: '0'
