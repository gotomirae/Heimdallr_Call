# PRD Ref: §10 · traps.md T10
#
# 테스트 + 깨끗한 환경 설치 검증.
#
# ★ **깨끗한 `pip install -e .`가 이 워크플로의 핵심이다.**
#   로컬 venv에 수동 설치된 패키지가 있으면 로컬은 전부 통과하고
#   Actions에서만 죽는다(참고 프로젝트 3회 재발, T10).
#   여기서 잡지 않으면 야간 배치가 조용히 실패한다.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 설치 (깨끗한 환경)
        run: pip install -e ".[dev]"

      # ★ 시크릿 없이 순수·리플레이 회귀를 돈다. `needs_secret`은 conftest가,
      #   `needs_network`는 명시적으로 제외한다. GitHub 러너 IP는 KIND가 403으로
      #   막으므로 실네트워크 collector 검증은 해당 예약 워크플로에서 수행한다.
      - name: 테스트
        run: python -m pytest tests/ -q -m "not needs_network"

      - name: 진입점 임포트 확인
        run: |
          for m in universe.build universe.sector_map collectors.replay collectors.price_run \
                   collectors.quarter_prices analysis.batch \
                   finance.enrich finance.backfill screener.run \
                   notify.batch notify.run notify.listen; do
            python -c "import src.$m" || exit 1
          done
