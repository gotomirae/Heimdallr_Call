# PRD Ref: §7/10 · ADR50 — Pro 전용·거래일16시, 자동 모델 호출 없음
name: macro_daily
permissions:
  contents: write
concurrency:
  group: macro-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -e .
    - run: python -m src.collectors.us_macro_daily --write
    - name: Publish verified snapshot
      run: "if git diff --quiet -- dashboard/lib/macro-daily.json; then\n  echo \"Same KST date and US market session; no\
        \ update.\"\n  exit 0\nfi\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\
        \ngit add dashboard/lib/macro-daily.json\ngit commit -m \"chore: refresh US macro snapshot\"\ngit push origin HEAD:main\n"
    if: ${{ false }}
'on':
  workflow_dispatch: null
