# PRD Ref: §9, §10 — 미국 전 거래일 장마감 자료를 08:00 KST 이후 갱신
name: macro_daily

on:
  schedule:
    - cron: "40 22 * * *"   # 07:40 KST 사전 예열 (미국 장마감 이후)
    - cron: "0,30 23 * * *" # 08:00, 08:30 KST; 지연·일시 장애 재시도
    - cron: "0 0 * * *"    # 09:00 KST 안전 재시도
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m src.collectors.us_macro_daily --write
      - name: Publish verified snapshot
        run: |
          if git diff --quiet -- dashboard/lib/macro-daily.json; then
            echo "Same KST date and US market session; no update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/lib/macro-daily.json
          git commit -m "chore: refresh US macro snapshot"
          git push origin HEAD:main
