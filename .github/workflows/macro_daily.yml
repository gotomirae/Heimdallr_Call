# PRD Ref: §9, §10 — 미국 전 거래일 장마감 자료를 07:00 KST 기준으로 갱신
name: macro_daily

on:
  schedule:
    - cron: "45 21 * * *"   # 06:45 KST 사전 갱신 — 겨울 미국 장마감+45분 이후
    - cron: "0,15,30 22 * * *" # 07:00 기준 확인·07:15/07:30 지연 재시도
    - cron: "0 23 * * *"    # 08:00 KST 안전 재시도
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m src.collectors.us_macro_daily --write
      - name: Publish verified snapshot
        run: |
          if git diff --quiet -- dashboard/lib/macro-daily.json; then
            echo "Same KST date and US market session; no update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/lib/macro-daily.json
          git commit -m "chore: refresh US macro snapshot"
          git push origin HEAD:main
