# PRD Ref: §9.1-3 · §10 — 전 종목 공시 수주 자료 점진 수집
name: order_disclosure

on:
  schedule:
    - cron: "37 17 * * 1-5" # 평일 02:37 KST, 다른 야간 작업과 분리
  workflow_dispatch:

concurrency:
  group: order-disclosure
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: 전 종목 최신 정기보고서 수주 원문 점진 수집
        run: python -m src.collectors.excerpt_run --all-universe --limit 500 --max-seconds 1800 --save
